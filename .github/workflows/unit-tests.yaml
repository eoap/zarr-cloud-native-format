          echo "VIRTUALENV_EXTRA_SEARCH_DIR=$RUNNER_TEMP/python-bootstrap" >> "$GITHUB_ENV"
          echo "VIRTUALENV_PIP=26.2.2" >> "$GITHUB_ENV"
          echo "VIRTUALENV_DOWNLOAD=false" >> "$GITHUB_ENV"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Set up Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Validate GeoZarr v1 multiscales layout profile
        run: task compliance:check:multiscales-layout

