[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "otsu"
dynamic = ["version"]
description = "Apply Otsu threshold to a raster"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["click==8.2.1", "loguru==0.7.3", "numpy==2.2.6", "rasterio==1.4.3", "scikit-image==0.25.2"]
classifiers = []

[[project.authors]]
name = "Fabrice Brito"
email = "info@terradue.com"

[project.scripts]
otsu = "otsu_tool.cli:to_otsu"

[tool.hatch.version]
path = "otsu_tool/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["otsu_tool"]

[tool.hatch.build.targets.sdist]
include = ["/otsu_tool", "/tests", "/requirements", "/README.md", "/LICENSE", "/pyproject.toml", "/Dockerfile", "/typing"]

[tool.hatch.envs.dev]
template = "dev"
python = "3.12"
skip-install = true
installer = "uv"
post-install-commands = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e ."]

[tool.hatch.envs.dev.scripts]
bootstrap = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e ."]
check = ["bootstrap", "format-check", "lint-check", "typecheck", "security"]
format-check = "ruff format --check otsu_tool tests"
lint-check = "ruff check otsu_tool tests"
typecheck = "mypy otsu_tool"
security = "bandit -r otsu_tool -ll"

[tool.hatch.envs.test]
template = "dev"

[tool.hatch.envs.test.scripts]
test = ["bootstrap", "pytest -q {args}"]

[tool.hatch.envs.default]
template = "dev"
skip-install = false
pre-install-commands = ["uv pip install --require-hashes -r requirements/development.txt"]
post-install-commands = ["uv pip install --no-deps --no-build-isolation -e ."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true
strict = true
mypy_path = "typing"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[project.urls]
Documentation = "https://eoap.github.io/zarr-cloud-native-format/"
Source = "https://github.com/eoap/zarr-cloud-native-format"
Issues = "https://github.com/eoap/zarr-cloud-native-format/issues"
