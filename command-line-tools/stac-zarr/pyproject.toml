[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stac-zarr"
dynamic = ["version"]
description = "STAC Zarr Cloud-Native Format Utilities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
keywords = []
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy"]
dependencies = ["odc-stac", "loguru", "zarr>=3.0.0", "pydantic>=2,<3", "geozarr-toolkit>=0.1.2,<0.2"]

[[project.authors]]
name = "Fabrice Brito"
email = "info@terradue.com"

[project.urls]
Documentation = "https://eoap.github.io/zarr-cloud-native-format/"
Issues = "https://github.com/eoap/zarr-cloud-native-format/issues"
Source = "https://github.com/eoap/zarr-cloud-native-format"

[project.scripts]
stac-zarr = "stac_zarr.app:to_zarr"
stac-zarr-validate = "stac_zarr.cli:validate_store"

[tool.hatch.envs.prod]
path = "/app/envs/prod"

[tool.hatch.envs.types]
extra-dependencies = ["mypy>=1.0.0"]

[tool.hatch.envs.dev]
template = "dev"
python = "3.12"
skip-install = true
installer = "uv"
post-install-commands = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e ."]

[tool.hatch.envs.dev.scripts]
bootstrap = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e ."]
check = ["bootstrap", "format-check", "lint-check", "typecheck", "security"]
format-check = "ruff format --check stac_zarr tests"
lint-check = "ruff check stac_zarr tests"
typecheck = "mypy stac_zarr"
security = "bandit -r stac_zarr -ll"

[tool.hatch.envs.test]
template = "dev"

[tool.hatch.envs.test.scripts]
test = ["bootstrap", "pytest -q {args}"]

[tool.hatch.envs.default]
template = "dev"
skip-install = false
pre-install-commands = ["uv pip install --require-hashes -r requirements/development.txt"]
post-install-commands = ["uv pip install --no-deps --no-build-isolation -e ."]

[tool.hatch.version]
path = "stac_zarr/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["stac_zarr"]

[tool.hatch.build.targets.sdist]
include = ["/stac_zarr", "/tests", "/requirements", "/README.md", "/LICENSE", "/pyproject.toml", "/Dockerfile"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
