name: GeoZarr validation

on:
  push:
    paths:
      - 'command-line-tools/stac-zarr/**'
      - 'scripts/validate_*.py'
      - '.github/workflows/geozarr-validation.yml'
  pull_request:
    paths:
      - 'command-line-tools/stac-zarr/**'
      - 'scripts/validate_*.py'
      - '.github/workflows/geozarr-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-line-tools/stac-zarr
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - name: Install the hash-locked validation environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --require-hashes -r requirements/development.txt
          uv pip install --no-deps --no-build-isolation -e .
      - run: .venv/bin/pytest -q
      - name: Validate published convention schemas
        run: |
           .venv/bin/python ../../scripts/validate_geo_proj_schema.py
           .venv/bin/python ../../scripts/validate_spatial_schema.py
           .venv/bin/python ../../scripts/validate_multiscales_schema.py
           .venv/bin/python ../../scripts/validate_multiscales_layout_profile.py
           .venv/bin/python ../../scripts/validate_eopf_explorer_profile.py
